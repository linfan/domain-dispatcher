# Domain Dispatcher configuration.
#
# Every value below is the built-in default, so an omitted key keeps its
# default value. The listeners section is required; everything else is optional.
#
# The forward section shares parameter names and defaults with the sibling
# project domain-forwarder.

global:
  # ---------------------------------------------------------------------------
  # Forwarding engine: upstream connection pool, timeouts and streaming
  # ---------------------------------------------------------------------------
  forward:
    buffer_size: 32768             # Copy buffer size in bytes (default: 32KB)
    max_idle_conns: 1000           # Max total idle (keep-alive) connections in the pool
    max_idle_conns_per_host: 100   # Max idle connections per upstream host
    max_conns_per_host: 0          # Max total connections per upstream host; 0 = unlimited
    idle_conn_timeout: 90s         # How long an idle connection is kept before closing
    tls_handshake_timeout: 10s     # TLS handshake timeout for upstream connections
    expect_continue_timeout: 1s    # Wait for a 100-continue before sending the request body
    response_header_timeout: 30s   # Max wait for the upstream response headers
    dial_timeout: 10s              # TCP connect timeout
    dial_keep_alive: 30s           # TCP keep-alive interval for upstream connections
    request_timeout: 60s           # Max wait for upstream response headers incl. dialing;
                                   # does not limit body transfer (0 = disabled)
    stream_idle_timeout: 0s        # Abort a response body that receives no bytes for this
                                   # long; 0s = disabled (e.g. 120s)
    response_body_timeout: 0s      # Total duration cap for a non-streaming response body;
                                   # 0s = disabled (e.g. 300s)
    streaming_flush: true          # Flush streaming (SSE) responses chunk by chunk
    disable_compression: true      # Never negotiate compression with the upstream, so a
                                   # compressing gateway cannot buffer SSE streams in bursts
    force_attempt_http2: true      # Attempt HTTP/2 for TLS upstream connections

  # HTTP server settings applied to every listener
  server:
    read_header_timeout: 10s       # Max time to read the request headers
    idle_timeout: 120s             # How long an idle keep-alive connection is kept
    max_header_bytes: 1048576      # Max size of request headers (1MB)
    shutdown_timeout: 30s          # Grace period for in-flight requests on SIGINT/SIGTERM

  # Optional file logging with size-based rotation (lumberjack).
  # Enabled only when both dir and filename are set; otherwise logs go to stderr.
  log:
    # dir: /var/log/domain-dispatcher
    # filename: app.log
    max_size: 100                  # Max size (MB) of one log file before rotation
    max_backups: 10                # Max number of rotated files to keep

  # Reject requests whose source IP matches an entry below with 403.
  # Entries are individual IPs or CIDR ranges.
  source_ip_blacklist: []
  # source_ip_blacklist:
  #   - 203.0.113.7
  #   - 192.168.0.0/16

  # Add X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host to forwarded requests
  add_proxy_headers: true

  # Extra per-request detail logs; the one-line request summary is always printed
  debug: false

# -----------------------------------------------------------------------------
# Listeners
# -----------------------------------------------------------------------------
listeners:
  - port: 8080
    type: http                     # http (default) or https
    dispatch:
      # Rules are matched by domain and optional path; the highest combined
      # score wins: exact domain +100 > wildcard domain +10, exact path +50 >
      # prefix wildcard +5. When matching prefix wildcards tie, the longest
      # prefix wins; remaining ties go to the first configured rule. A rule's
      # priority is added to its score for manual ordering of overlapping rules.
      - domain: abc-api.com
        forward_to: https://abc.com/api
      - domain: xyz-api.com
        forward_to: https://xyz.com/api
        type: forward              # forward (default), redirect or mock
        remove_headers:            # Strip these headers before forwarding
          - X-Forwarded-For
          - X-Real-IP
      # Rewrite the forwarded request before it reaches the upstream (only for
      # forward rules). domain overrides the Host header sent upstream; url
      # applies a regex substitution to the request path while the query string
      # is preserved. $1 (or ${name}) references capture groups; $$ is a literal $.
      - domain: rewrite-api.com
        forward_to: http://127.0.0.1:9000
        rewrite:
          domain: backend.internal
          url:
            pattern: '^/api/v1/(.*)$'
            replacement: '/v2/$1'
      - domain: mock-api.com
        type: mock                 # Respond locally without contacting an upstream
        mock_status: 200           # Optional HTTP status code (default 200)
        mock_headers:
          Content-Type: application/json
        mock_body: '{"status":"ok","message":"mock response"}'
      - domain: mock-api.com
        path: /health              # Exact path match
        type: mock
        priority: 100              # Manual priority added to the match score
        mock_headers:
          Content-Type: application/json
        mock_body: '{"status":"healthy"}'
      - domain: xyz-api.com
        path: /api/*               # Prefix wildcard: only requests under /api/
        forward_to: https://xyz.com/backend
      # Wildcard domain fallback for domains without an exact rule:
      # - domain: "*"
      #   forward_to: http://127.0.0.1:9000

  # HTTPS listener example. TLS certificates are domain-bound, so each dispatch
  # rule that should be reachable over HTTPS carries its own certificate and the
  # cert matching the client's TLS SNI server name is presented. The cert of a
  # "*" wildcard rule, if any, is the fallback for unknown domains and clients
  # that send no SNI; without it those connections fail the handshake. Startup
  # validation requires at least one certificate per https listener, existing
  # cert/key files, and rejects two different certs for the same domain.
  # - port: 8443
  #   type: https
  #   dispatch:
  #     - domain: abc-api.com
  #       forward_to: https://abc-api.com:8080
  #       tls:
  #         cert_file: /etc/domain-dispatcher/certs/abc-api.com.crt
  #         key_file: /etc/domain-dispatcher/certs/abc-api.com.key
  #     - domain: xyz-api.com
  #       path: /api/*
  #       forward_to: https://xyz.com/backend
  #       tls:
  #         cert_file: /etc/domain-dispatcher/certs/xyz-api.com.crt
  #         key_file: /etc/domain-dispatcher/certs/xyz-api.com.key
  #     - domain: "*"                    # fallback rule and fallback certificate
  #       forward_to: http://127.0.0.1:9000
  #       tls:
  #         cert_file: /etc/domain-dispatcher/certs/default.crt
  #         key_file: /etc/domain-dispatcher/certs/default.key
